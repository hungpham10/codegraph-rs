[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "figma-cli"
version = "0.1.0"
description = "Python CLI for Figma REST API v1 - fetch files, components, styles, and export assets"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Hung Pham", email = "hungpham@example.com"}
]
keywords = ["figma", "api", "design", "components", "styles", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
figma = "figma_lib.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/figma_lib"]
