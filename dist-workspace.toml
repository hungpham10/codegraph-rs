[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# Allow release.yml to be hand-edited (we append the codesign + cosign jobs
# after the generated `host` job). Without this, cargo-dist aborts the release
# because the committed release.yml no longer matches its generated output.
allow-dirty = true
# CI backends to support
ci = "github"
# cargo-dist builds cross-compiled archives and the GitHub Release.
# Homebrew (.rb) and Linux (.deb/.rpm) packages are produced by dedicated
# jobs in .github/workflows/release.yml from these archives.
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
