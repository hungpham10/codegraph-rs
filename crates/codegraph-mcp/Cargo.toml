[package]
name = "codegraph-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Luồng HTTP MCP riêng (session theo mcp-session-id) — chưa implement, xem src/http.rs.
http = []

[dependencies]
codegraph-api    = { path = "../codegraph-api" }
codegraph-core    = { path = "../codegraph-core" }
codegraph-extract = { path = "../codegraph-extract" }
codegraph-graph   = { path = "../codegraph-graph", features = ["sqlite"] }
codegraph-context = { path = "../codegraph-context" }
codegraph-sboxes  = { path = "../codegraph-sboxes" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
camino = { workspace = true }
rmcp = { version = "3.1.2", features = ["transport-io"] }

[dev-dependencies]
tempfile = "3"
