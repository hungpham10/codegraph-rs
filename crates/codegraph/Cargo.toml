[package]
name = "codegraph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local-first code intelligence: tree-sitter knowledge graph + MCP server."

[[bin]]
name = "codegraph"
path = "src/main.rs"

[dependencies]
codegraph-graph     = { path = "../codegraph-graph", features = ["sqlite", "lmdb", "bloom-search"] }
codegraph-extract   = { path = "../codegraph-extract" }
codegraph-mcp       = { path = "../codegraph-mcp", features = ["http"] }
clap = { workspace = true }
tokio = { workspace = true }
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
ignore = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
camino = { workspace = true }
indicatif = "0.18.6"

[features]
# Mặc định bật RDBMS (Postgres/MySQL) để CLI + MCP server có thể serve backend
# multi-tenant. Embedding fastembed LÀ OPT-IN — chỉ bật khi cần semantic search:
# `cargo build --features fastembed` (hoặc set `[embedding] backend = "fastembed"`
# trong config khi chạy với bản đã compile sẵn fastembed). Tắt để build
# nhẹ: `cargo build --no-default-features`.
default = ["rdbms"]
rdbms = ["codegraph-graph/postgres", "codegraph-graph/mysql", "codegraph-mcp/rdbms"]
# Embedding backend fastembed (semantic search) — OPT-IN, không bật mặc định.
fastembed = ["codegraph-graph/fastembed"]
# macOS-only: bật CoreML EP cho ONNX Runtime (embed trên Apple GPU/ANE). Chỉ có
# nghĩa khi build trên macOS + `--features fastembed,apple-accel`. Non-macOS bật
# feature này sẽ lỗi (ort coreml chỉ compile trên macOS). Metal EP chưa được
# expose bởi bản ort hiện tại → "metal" config cũng map sang CoreML.
apple-accel = ["codegraph-graph/apple-accel"]
