[package]
name = "codegraph"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local-first code intelligence: tree-sitter knowledge graph + MCP server."

[[bin]]
name = "codegraph"
path = "src/main.rs"

[dependencies]
codegraph-graph     = { path = "../codegraph-graph", features = ["sqlite", "lmdb", "bloom-search"] }
codegraph-extract   = { path = "../codegraph-extract" }
codegraph-mcp       = { path = "../codegraph-mcp", features = ["http"] }
clap = { workspace = true }
tokio = { workspace = true }
notify = { workspace = true }
notify-debouncer-full = { workspace = true }
ignore = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
camino = { workspace = true }
indicatif = "0.18.6"

[features]
default = []
