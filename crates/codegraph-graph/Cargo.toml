[package]
name = "codegraph-graph"
version.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true

[lints.rust]
warnings = "deny"

[dependencies]
codegraph-core = { path = "../codegraph-core" }
codegraph-db   = { path = "../codegraph-db" }

# SearchIndex and related modules (moved from codegraph-libs)
serde = { workspace = true }
serde_json = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
smallvec = "1"
async-trait = { workspace = true }
thiserror = { workspace = true }

# For SearchIndex functionality (moved from codegraph-libs)
redis = { version = "1.0", features = ["tokio-comp"], optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync"] }
zstd = { version = "0.13", optional = true }
bincode = { version = "1.3", optional = true }
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[features]
default = []
redis = ["dep:redis", "dep:zstd", "dep:bincode"]
sqlite = ["dep:rusqlite"]
bloom-search = []

[dev-dependencies]
tempfile = "3"
camino = { workspace = true }
