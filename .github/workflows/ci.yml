name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install grcov
        run: cargo install grcov
      - name: Run tests with coverage instrumentation
        env:
          RUSTFLAGS: "-Cinstrument-coverage"
          LLVM_PROFILE_FILE: "codegraph-%p-%m.profraw"
        run: cargo test --workspace --no-fail-fast
      - name: Generate coverage report (lcov)
        run: |
          mkdir -p ./target/coverage
          grcov . \
            --binary-path ./target/debug/ \
            --source-dir . \
            --output-type lcov \
            --branch \
            --ignore-not-existing \
            --ignore "/*" \
            --ignore "*/tests/*" \
            --ignore "*/benches/*" \
            --output-path ./target/coverage/lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./target/coverage/lcov.info
          verbose: true
          fail_ci_if_error: false


  slim:
    name: slim build (no visualize)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p codegraph --no-default-features -- -D warnings
      - run: cargo build -p codegraph --no-default-features
      - run: |
          cargo run -p codegraph --no-default-features -- --help | tee help.txt
          ! grep -q visualize help.txt
