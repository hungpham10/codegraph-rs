# Signs + ad-hoc-codesigns release artifacts AFTER cargo-dist publishes them.
# Runs on `release: published` (same trigger as release.yml). It is intentionally
# separate from cargo-dist's generated release.yml so re-generating dist config
# never clobbers it.
#
# What it does:
#   - wait-assets : poll until the macOS tarballs are uploaded by release.yml
#   - codesign-macos : re-codesign the macOS binaries ad-hoc (so they at least
#       carry a signature; rustc already ad-hoc-signs, this is belt-and-suspenders)
#       and re-upload the tarball + its .sha256.
#   - cosign : keyless (Sigstore OIDC) sign every binary archive and attach the
#       .sig / .crt so users can cryptographically verify authenticity.
#
# NOTE: this does NOT make macOS Gatekeeper / Windows SmartScreen trust the
# binary (that needs a paid Apple/Authenticode cert). It provides verifiable
# provenance + a signature, and removes one friction point on macOS.

name: Sign & Verify Release

on:
  release:
    types: [published]
  # Allow manually signing an already-published release (e.g. v2.0.1) from the
  # Actions tab — useful for backfilling signatures without a new release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sign (e.g. v2.0.1)"
        required: true
        default: ""

permissions:
  contents: write        # upload release assets (.sig / .crt / re-packed tarball)
  id-token: write        # keyless cosign (Sigstore OIDC)

jobs:
  wait-assets:
    name: Wait for release assets
    runs-on: ubuntu-latest
    steps:
      - name: Poll until macOS tarballs exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            names=$(gh release view "$TAG" --repo "${{ github.repository }}" \
              --json assets -q '[.assets[].name] | join("\n")')
            echo "assets so far: $(echo "$names" | wc -l)"
            if echo "$names" | grep -qx 'codegraph-aarch64-apple-darwin.tar.gz' \
               && echo "$names" | grep -qx 'codegraph-x86_64-apple-darwin.tar.gz'; then
              echo "darwin assets present"; exit 0
            fi
            sleep 15
          done
          echo "timed out waiting for release assets" >&2; exit 1

  codesign-macos:
    name: Ad-hoc codesign macOS binaries
    needs: wait-assets
    runs-on: macos-latest
    steps:
      - name: Re-codesign + re-upload macOS tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for triple in x86_64-apple-darwin aarch64-apple-darwin; do
            asset="codegraph-$triple.tar.gz"
            echo "== $asset =="
            rm -rf work && mkdir work && cd work
            gh release download "$TAG" --repo "$REPO" --pattern "$asset" --dir .
            tar -xzf "$asset"
            bin=$(find . -name codegraph -type f | head -n1)
            echo "codesign --force --deep --sign - $bin"
            codesign --force --deep --sign - "$bin"
            top=$(basename "$(dirname "$bin")")
            tar -czf "../$asset" "$top"
            cd ..
            sha=$(sha256sum "$asset" | awk '{print $1}')
            echo "$sha" > "$asset.sha256"
            gh release upload "$TAG" "$asset" "$asset.sha256" --repo "$REPO" --clobber
          done

  cosign:
    name: Cosign (keyless) sign artifacts
    needs: codesign-macos
    runs-on: ubuntu-latest
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: Sign every binary archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dl
          gh release download "$TAG" --repo "$REPO" --dir dl
          shopt -s nullglob
          for f in dl/codegraph-*.tar.gz dl/codegraph-*.zip; do
            echo "cosign $f"
            cosign sign-blob --yes "$f" \
              --output-signature "$f.sig" \
              --output-certificate "$f.crt"
          done
          shopt -u nullglob
          gh release upload "$TAG" dl/codegraph-*.sig dl/codegraph-*.crt \
            --repo "$REPO" --clobber
