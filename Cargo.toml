[workspace]
resolver = "2"
members = [
    "crates/codegraph-core",
    "crates/codegraph-extract",
    "crates/codegraph-graph",
    "crates/codegraph-context",
    "crates/codegraph-api",
    "crates/codegraph-graphql",
    "crates/codegraph-sboxes",
    "crates/codegraph-mcp",
    "crates/codegraph-bench",
    "crates/codegraph-installer",
    "crates/codegraph",
]

[workspace.package]
version = "2.0.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/hungpham10/codegraph-rs"
homepage = "https://github.com/hungpham10/codegraph-rs"
authors = ["Cleboost <clement.balarot@gmail.com>"]

[workspace.dependencies]
# core
serde = { version = "1", features = ["derive"] }
# preserve_order: json!-built objects emit keys in written (documented) order
# thay vì alphabet — derived structs luôn serialize theo declaration order.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
async-trait = "0.1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# storage
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
redis = { version = "1.0", features = ["tokio-comp"] }
# postgres/mysql drivers cho backend RDBMS sharded (feature `postgres`/`mysql`
# trên codegraph-graph gate module `storage/rdbms.rs`; sqlx enable như sqlite —
# feature unification khiến driver thêm là additive cho mọi consumer).
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "mysql"] }

# embedded memory-mapped KV (bundled C — no system lib needed)
lmdb-rkv = "0.14"

# tree-sitter core
tree-sitter = "0.25"

# tree-sitter grammars (one feature per lang on extract crate)
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python     = "0.23"
tree-sitter-rust       = "0.23"
tree-sitter-go         = "0.23"
tree-sitter-java       = "0.23"
tree-sitter-c          = "0.23"
tree-sitter-cpp        = "0.23"
tree-sitter-c-sharp    = "0.23"
tree-sitter-ruby       = "0.23"
tree-sitter-php        = "0.23"
tree-sitter-scala      = "0.26"
tree-sitter-swift      = "0.7"
tree-sitter-kotlin     = "0.3"
tree-sitter-lua        = "0.5"

# cli / async / fs
clap = { version = "4", features = ["derive", "wrap_help"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-std", "io-util", "fs", "sync", "time"] }
notify = "7"
notify-debouncer-full = "0.4"
ignore = "0.4"
globset = "0.4"
walkdir = "2"

# misc
camino = { version = "1", features = ["serde1"] }
dashmap = "6"
once_cell = "1"
parking_lot = "0.12"
rayon = "1"
indicatif = "0.17"
dirs = "5"
toml_edit = "0.22"
jsonc-parser = "0.26"
dialoguer = "0.11"
console = "0.15"
which = "7"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip"] }
rust-embed = "8"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# graphql (codegraph-graphql API server)
async-graphql = "7.2.1"
async-graphql-axum = "7.2.1"
futures-util = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release-small]
inherits = "release"
opt-level = "z"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
